<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pas de connexion</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f3ea; color: #1f2a22; padding: 16px; box-sizing: border-box; }
  .box { max-width: 420px; text-align: center; background: #fff; border-radius: 18px; padding: 28px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  img { width: 96px; height: 96px; }
  h1 { font-size: 1.35rem; margin: .6rem 0; color: #1d6b35; }
  p { color: #5d6a5f; line-height: 1.5; }
  button { margin-top: .8rem; border: 0; border-radius: 12px; padding: .8rem 1.4rem; font-size: 1rem; font-weight: 700; background: #1d6b35; color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #111813; color: #e8efe9; } .box { background: #1a241d; } p { color: #a9b8ac; } }
</style></head>
<body><div class="box">
  <img src="/static/img/app-192.png" alt="">
  <h1>📶 Pas de connexion internet</h1>
  <p>Le logiciel a besoin d'internet pour enregistrer vos saisies. Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
  <p><small>Notez vos chiffres sur papier en attendant : rien n'est perdu.</small></p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</div></body></html>
